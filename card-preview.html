<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>魔术眼字卡 · 结构预览</title>
    <link rel="stylesheet" href="cards.css">
    <style>
        @font-face {
            font-family: FangSong;
            src: url('assets/fangsong.ttf') format('truetype');
            font-display: swap;
        }
        :root {
            color-scheme: light;
            --ink: #24382f;
            --muted: #738077;
            --line: #d5d7ca;
            --brass: #aa8950;
            --code-red: #8a392c;
            --mono: Menlo, Consolas, monospace;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f3f3eb;
            color: var(--ink);
            font-family: system-ui, -apple-system, sans-serif;
        }
        main { max-width: 1680px; margin: 0 auto; padding: 48px 40px 32px; }
        .eyebrow {
            margin: 0 0 12px;
            color: #92733e;
            font: 11px/1.5 var(--mono);
            letter-spacing: 0.2em;
        }
        header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
        h1 { margin: 0; font: 34px/1.3 FangSong, serif; letter-spacing: 0.06em; }
        .badge { margin-top: 7px; border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; white-space: nowrap; font-size: 12px; color: var(--muted); }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 28px;
            padding: 18px 0;
            border-top: 1px solid var(--line);
        }
        .control { display: flex; align-items: center; gap: 10px; }
        label { font-size: 12px; color: #5c6b60; white-space: nowrap; }
        select, button {
            min-height: 38px;
            border: 1px solid #c9cdbe;
            border-radius: 6px;
            background: #fffef6;
            color: var(--ink);
            font: 12px/1.3 var(--mono);
        }
        select { min-width: 168px; padding: 8px 30px 8px 10px; }
        button { padding: 8px 12px; cursor: pointer; }
        button:hover { border-color: var(--brass); background: #faf3df; }
        button[aria-pressed="true"] { border-color: var(--brass); background: #f3e9d0; }
        :focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
        input[type="range"] { width: 128px; accent-color: #987b47; }
        output { width: 42px; font: 11px var(--mono); color: #6c766c; }
        .zoom { margin-left: auto; }
        .workbench {
            overflow: hidden;
            border: 1px solid #879386;
            border-radius: 12px;
            background: #53665b;
            box-shadow: 0 10px 28px #23322912;
        }
        .bench-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 22px;
            border-bottom: 1px solid #ffffff17;
            color: #e1e6d7;
            font-size: 12px;
        }
        .bench-heading span:last-child { color: #c0cbb9; font-family: var(--mono); font-size: 11px; }
        #card-viewport {
            min-height: 330px;
            overflow: auto;
            padding: 52px 32px;
            scrollbar-color: #bcb99b #43564b;
            background-color: #43564b;
            background-image:
                linear-gradient(#ffffff04 1px, transparent 1px),
                linear-gradient(90deg, #ffffff04 1px, transparent 1px);
            background-size: 24px 24px;
        }
        #card-art { display: block; flex-shrink: 0; margin: 0 auto; overflow: visible; }
        .legend { display: flex; flex-wrap: wrap; gap: 16px 26px; padding: 20px 0 16px; font-size: 12px; color: #667367; }
        .legend span { display: inline-flex; align-items: center; gap: 7px; }
        .swatch { width: 7px; height: 7px; border-radius: 50%; background: #15221d; }
        .swatch.borrowed { background: #8a392c; }
        .slit-swatch { width: 8px; height: 20px; border-radius: 2px; background: #43564b; }
        .legend code, .legend kbd {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border: .8px solid #c6b58e;
            border-radius: 50%;
            background: #e6dcc3;
            color: var(--code-red);
            font: 14px/1 var(--mono);
        }
        .legend kbd { border-color: #bdb6a5; border-radius: 5px; background: #f7f3e8; color: var(--ink); }
        #data-status { color: #8a392c; font-size: 12px; }
        @media (max-width: 700px) {
            main { padding: 28px 18px; }
            h1 { font-size: 27px; }
            .badge { display: none; }
            .zoom { margin-left: 0; flex-wrap: wrap; }
            input[type="range"] { width: 100px; }
            #card-viewport { padding: 40px 20px; min-height: 230px; }
            .bench-heading { padding: 14px 16px; }
        }
        @media print {
            @page { size: landscape; margin: 12mm; }
            body { background: white; }
            main { padding: 0; max-width: none; }
            header, .toolbar, .bench-heading, .legend, #data-status { display: none; }
            .workbench { border: 0; border-radius: 0; box-shadow: none; background: white; }
            #card-viewport { padding: 0; min-height: 0; overflow: visible; background: white; }
            #card-art { width: 100% !important; height: auto; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <p class="eyebrow">MINGKWAI / CARD</p>
            <h1>魔术眼字卡</h1>
        </div>
        <span class="badge">结构预览</span>
    </header>
    <div class="toolbar" aria-label="字卡预览设置">
        <div class="control">
            <label for="card-select">滚筒字卡</label>
            <select id="card-select"></select>
        </div>
        <div class="control zoom">
            <label for="zoom">缩放</label>
            <input id="zoom" type="range" min="10" max="160" step="1" value="100">
            <output id="zoom-value" for="zoom">100%</output>
            <button id="fit" type="button" aria-pressed="true">全卡</button>
            <button id="actual-size" type="button" aria-pressed="false">100%</button>
        </div>
    </div>
    <section class="workbench" aria-label="字卡外观">
        <div class="bench-heading">
            <span id="card-label">字卡 G</span>
            <span>28 COLUMNS / 8 + 1 ROWS</span>
        </div>
        <div id="card-viewport" tabindex="0" aria-label="字卡画布，可横向滚动查看">
            <svg id="card-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1832 478" width="1832" height="478" role="img" aria-labelledby="preview-card-card-title preview-card-card-description"></svg>
        </div>
    </section>
    <div class="legend" aria-label="图例">
        <span><i class="slit-swatch" aria-hidden="true"></i>贯穿竖缝</span>
        <span><i class="swatch" aria-hidden="true"></i>原位字</span>
        <span><i class="swatch borrowed" aria-hidden="true"></i>借位字</span>
        <span><code>9</code>翻页提示</span>
    </div>
    <p id="data-status" role="status" hidden></p>
</main>

<script>
(() => {
    'use strict';
    const { width: WIDTH, height: HEIGHT, createCard, groupCards } = window.MingKwaiCards;
    const svg = document.getElementById('card-art');
    const viewport = document.getElementById('card-viewport');
    const selector = document.getElementById('card-select');
    const zoomInput = document.getElementById('zoom');
    const zoomValue = document.getElementById('zoom-value');
    const fitButton = document.getElementById('fit');
    const sizeButton = document.getElementById('actual-size');
    let cards = JSON.parse(document.getElementById('card-data').textContent);
    let fitView = true;

    function renderCard() {
        const card = cards.find(item => item.key === selector.value) || cards[0];
        const index = cards.indexOf(card);
        svg.replaceChildren(createCard(card, index, cards.length, { idPrefix: 'preview-card' }));
        document.getElementById('card-label').textContent = `字卡 ${card.key} · 第 ${Math.floor(index / 6) + 1} 组 / 第 ${index % 6 + 1} 滚筒`;
    }
    function fillSelector(preferred = 'G') {
        selector.replaceChildren(...cards.map((card, index) => {
            const option = document.createElement('option');
            option.value = card.key;
            option.textContent = `${String(index + 1).padStart(2, '0')}  ·  ${card.key}`;
            return option;
        }));
        selector.value = cards.some(card => card.key === preferred) ? preferred : cards[0].key;
        renderCard();
    }
    function setZoom(scale) {
        scale = Math.max(.1, Math.min(1.6, scale));
        svg.style.width = `${WIDTH * scale}px`;
        svg.style.height = `${HEIGHT * scale}px`;
        zoomInput.value = String(Math.round(scale * 100));
        zoomValue.value = `${Math.round(scale * 100)}%`;
        fitButton.setAttribute('aria-pressed', String(fitView));
        sizeButton.setAttribute('aria-pressed', String(!fitView && Math.abs(scale - 1) < .001));
    }
    function fitCard() {
        const style = getComputedStyle(viewport);
        const available = viewport.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
        setZoom(Math.min(1, available / WIDTH));
        viewport.scrollLeft = 0;
    }
    selector.addEventListener('change', renderCard);
    zoomInput.addEventListener('input', () => { fitView = false; setZoom(Number(zoomInput.value) / 100); });
    fitButton.addEventListener('click', () => { fitView = true; fitCard(); });
    sizeButton.addEventListener('click', () => { fitView = false; setZoom(1); });
    new ResizeObserver(() => { if (fitView) fitCard(); }).observe(viewport);
    fillSelector();
    fitCard();

    // Embedded data keeps this preview usable when opened directly as a file.
    // A local server uses the latest CSV, so edits to the real word table appear here.
    function parseCSV(source) {
        const rows = [];
        let row = [], field = '', quoted = false;
        for (let i = 0; i < source.length; i++) {
            const char = source[i];
            if (char === '"') {
                if (quoted && source[i + 1] === '"') { field += '"'; i++; }
                else quoted = !quoted;
            } else if (char === ',' && !quoted) {
                row.push(field); field = '';
            } else if ((char === '\n' || char === '\r') && !quoted) {
                if (char === '\r' && source[i + 1] === '\n') i++;
                row.push(field); if (row.some(Boolean)) rows.push(row);
                row = []; field = '';
            } else field += char;
        }
        row.push(field); if (row.some(Boolean)) rows.push(row);
        const headers = rows.shift();
        return rows.map(values => Object.fromEntries(headers.map((name, i) => [name, values[i] || ''])));
    }
    if (location.protocol === 'http:' || location.protocol === 'https:') {
        fetch('dev/wubi06.csv').then(response => {
            if (!response.ok) throw new Error(`Unable to load cards: ${response.status}`);
            return response.text();
        }).then(source => {
            const selected = selector.value;
            cards = groupCards(parseCSV(source));
            fillSelector(selected);
        }).catch(() => {
            const status = document.getElementById('data-status');
            status.textContent = '字表暂时无法刷新，正在显示内置字卡。';
            status.hidden = false;
        });
    }
})();
</script>
